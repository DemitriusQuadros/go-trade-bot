services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379" 
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: TradeBot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerting:/etc/prometheus/alerting
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin" 
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # worker runs the Asynq task processor that executes trading-strategy cycles,
  # including the Lua scripting engine (backend-04). A runaway or leaking Lua
  # VM is the motivating risk for a hard memory ceiling (backend-06).
  #
  # mem_limit (the legacy top-level key) is used rather than
  # deploy.resources.limits.memory because this stack is driven by the
  # Makefile's `docker-compose` (Compose v1 command) in non-Swarm mode, where
  # mem_limit is the universally-honored knob and deploy.resources is ignored
  # outside Swarm. If the deployment moves to `docker compose` v2 / Swarm,
  # switch to deploy.resources.limits.memory.
  #
  # 512m is a PLACEHOLDER pending a real production baseline: spec backend-06
  # Step 1 calls for a 24h steady-state RSS measurement (not performable in
  # this environment) to size this properly. Revisit once that baseline exists;
  # set it to roughly 2x observed steady-state RSS.
  #
  # restart: unless-stopped ensures the container is brought back after an
  # OOM-kill - a memory-limited container with no restart policy is worse than
  # no limit at all (a single leak permanently takes the worker down).
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: worker
    container_name: worker
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - redis
      - postgres
    volumes:
      - ./config.yml:/root/config.yml:ro

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  postgres_data: