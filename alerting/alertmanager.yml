global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'strategy']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'webhook-receiver'

receivers:
  - name: 'webhook-receiver'
    webhook_configs:
      - url: 'http://host.docker.internal:5678/webhook/trade-bot'
        send_resolved: true
