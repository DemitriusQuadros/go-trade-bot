BROKER:
  KEY: dummy
  SECRET: dummy
  # Used only when TESTNET: true (paper mode) - never the production keys.
  TESTNET_KEY: ""
  TESTNET_SECRET: ""

DB:
  HOST: localhost
  PORT: 5432
  USER: your_user
  PASSWORD: your_password
  DBNAME: TradeBot
  SSLMODE: disable

REDIS:
  ADDR: localhost:6379

PROMETHEUS:
  ADDRESS: localhost:9095

# Process-wide execution-mode ceiling: backtest | dryrun | paper | live.
# Unset = dryrun (the safest tier). A strategy only trades live when BOTH its
# own mode and this ceiling allow it.
MODE: dryrun
# Required (true) for cmd/worker to start with MODE: live. Leave false.
CONFIRM_LIVE: false
# true = the exchange adapter targets the Binance testnet (paper mode).
# MODE: live refuses to start with TESTNET: true.
TESTNET: false

# Simulated fills for dryrun strategies.
DRY_RUN:
  SLIPPAGE_PCT: 0.05   # % applied to market fills and simulated stops (default 0.05)
  FEE_PCT: 0.075       # % fee per fill (median crypto rate: 0.075% Binance BNB rate)
  FILL_DELAY: 50ms     # simulated execution latency

# Outbound trade-event webhook (optional; empty = disabled).
WEBHOOK_URL: ""

# --- Authentication (auth-01) ------------------------------------------------
# Auth is ON by default. Users sign in with a username + password and get an
# HttpOnly session cookie (gtb_session, 30 days, sliding).
AUTH:
  # First run only: when the users table is empty, cmd/api creates this admin
  # on startup. Remove BOOTSTRAP_ADMIN_PASSWORD after the first start.
  BOOTSTRAP_ADMIN_USERNAME: ""
  BOOTSTRAP_ADMIN_PASSWORD: ""   # >= 10 characters
  # Trust X-Forwarded-Proto for the cookie's Secure flag. Set true behind
  # cloudflared or any HTTPS reverse proxy.
  TRUST_PROXY: false
  # Extra Origin values accepted by the CSRF check besides the request's own
  # host (the web UI also sends X-Requested-With: gtb).
  ALLOWED_ORIGINS: []            # e.g. ["https://bot.example.com"]

# Cloudflare Access (defense in depth, optional). When BOTH are set, every
# request (API and web UI) must carry a valid Cf-Access-Jwt-Assertion header
# or CF_Authorization cookie, otherwise 403 {"error":"access_required"}.
# See docs/deploy/cloudflare-tunnel.md.
CF_ACCESS:
  TEAM_DOMAIN: ""   # e.g. myteam.cloudflareaccess.com
  AUD: ""           # the Access application's audience (AUD) tag

# Optional service token for scripts and MCP-over-HTTP:
# "Authorization: Bearer <API_TOKEN>" acts as an admin ("service") principal.
# The old ?token= query parameter is no longer accepted.
API_TOKEN: ""

# DANGER: disables authentication entirely - every request acts as an admin.
# Only for a local machine that is never reachable from a network. cmd/api
# logs a loud warning on every start when this is true.
ALLOW_INSECURE_NO_AUTH: false

# cmd/api -> cmd/worker loopback settings bridge.
INTERNAL_BRIDGE_ADDR: 127.0.0.1:9193
INTERNAL_BRIDGE_SECRET: ""

# AI agent (model provider credentials). PROVIDER: anthropic | gemini.
# Agent personas may override provider/model individually (Agents page).
AGENT:
  PROVIDER: anthropic
  ANTHROPIC_KEY: ""
  ANTHROPIC_MODEL: ""   # empty = adapter default
  GEMINI_KEY: ""
  GEMINI_MODEL: ""      # empty = adapter default

# cmd/agent runtime (agents platform). All optional - defaults shown.
AGENT_RUNTIME:
  CONCURRENCY: 2        # asynq workers on the "agents" queue
  METRICS_PORT: "9194"  # /metrics for cmd/agent (9193 is the worker's loopback settings bridge)
  SYNC_INTERVAL: 30s    # how often cron schedules are re-read from the DB

# Base URL used in agent report deep links sent to webhooks
# (<API_BASE_URL>/agents/reports/<id>). Behind a tunnel: https://<your host>.
API_BASE_URL: http://localhost:8080

# Candle datasets (reconciler inside cmd/worker; see docs/specs/candle-data)
CANDLE_DATA:
  CONCURRENCY: 2        # workers on the dedicated candle queues (never competes with trading cycles)
  WEIGHT_BUDGET: 3000   # Binance request weight per minute the importer may use across all replicas (limit 6000/IP)
