name: CI/CD Pipeline - Test & Deploy

on:
  push:
    branches:
      - master
      - refactor/full-rewrite
  pull_request:
    branches:
      - master
      - refactor/full-rewrite
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. TEST & VERIFICATION
  # ============================================================================
  test:
    name: Run Automated Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Backend Unit & Integration Tests
        run: go test -v -race ./internal/... ./app/...

      - name: Setup Node.js (Web Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Verify Web Frontend Build
        run: |
          cd web
          npm ci
          npm run build

  # ============================================================================
  # 2. CONTINUOUS DEPLOYMENT (VPS)
  # ============================================================================
  deploy:
    name: Deploy to Hetzner Production VPS
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 [1/3] Pulling latest commit on VPS..."
            cd /root/serverstack/vps/go-trade-bot
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            echo "📦 [2/3] Updating and building containers..."
            cd /root/serverstack/vps
            docker compose build tradebot-api tradebot-worker tradebot-agent tradebot-mcp

            echo "🔄 [3/3] Gracefully restarting TradeBot services..."
            docker compose up -d tradebot-api tradebot-worker tradebot-agent tradebot-mcp

            echo "✅ Deployment completed successfully!"
            docker ps --filter "name=tradebot" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
