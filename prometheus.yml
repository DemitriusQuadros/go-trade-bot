global:
  scrape_interval: 10s

rule_files:
  - "/etc/prometheus/alerting/rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'go-app'
    static_configs:
      - targets: ['host.docker.internal:8080']
  - job_name: 'go-worker'
    static_configs:
      - targets: ['host.docker.internal:9191']