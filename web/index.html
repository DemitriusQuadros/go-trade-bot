<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gopher-face.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go Trade Bot — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before paint so a returning visitor never sees a flash of
      // the wrong theme. Mirrors hooks/useTheme.ts's own resolution order
      // (explicit choice > system preference > dark default) - keep the two
      // in sync if that order ever changes.
      (function () {
        var stored = localStorage.getItem('gtb-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
